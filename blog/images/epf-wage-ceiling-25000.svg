<text x="430" y="410" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800" fill="#0A2463">₹15,000</text>
<text x="750" y="330" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">₹25,000</text>
<path d="M545 395 C 580 395 590 330 628 250" fill="none" stroke="#2E9E3F" stroke-width="10" stroke-linecap="round"/>
<path d="M600 262 L632 238 L640 278 Z" fill="#2E9E3F"/>
<rect y="614" width="400" height="16" fill="#E87722"/><rect x="400" y="614" width="400" height="16" fill="#FFFFFF"/><rect x="800" y="614" width="400" height="16" fill="#2E9E3F"/>
